# default_configs/narrowband_clean_test_all.yaml
# narrowband, no impairments, all per-signals classes
schema_version: "2.1.1"
dataset_id: "narrowband_clean_test_all"
dataset_length: 13_800   # 200 items per signal class (69 classes)
seed: 1234567894
impairment_level: 0  # clean, ideal digital signals

output:
  representation: "iq" # time series I/Q format

signal_sampling:
  mode: "per_signal" # equal probability per signal class

# narrowband: single signal channelized, quasi-time-aligned, moderate bandwidth
dataset_metadata:
  sample_rate: 10_000_000
  num_iq_samples_dataset: 4096
  fft_size: 64
  fft_stride: 64
  num_signals_min: 1
  num_signals_max: 1
  cochannel_overlap_probability: 0.0
  snr_db_min: 0.0
  snr_db_max: 50.0
  noise_power_db: 0.0
  signal_duration_in_samples_min: 3276
  signal_duration_in_samples_max: 4096
  bandwidth_min: 2500000
  bandwidth_max: 3333333
  signal_center_freq_min: -2500000
  signal_center_freq_max: 2499999
  frequency_min: -2500000
  frequency_max: 2499999
